/* ================= HISTORY & PAGE SAVE ================= */

let currentPage = null;
function openPage(pageId, addToHistory = true) { if (pages[pageId]) { if(addToHistory) { history.pushState({ page: pageId }, null, ""); } localStorage.setItem("currentPage", pageId); document.getElementById("detailTitle").innerHTML = pages[pageId].title; document.getElementById("headerTitle").innerHTML = pages[pageId].title; document.getElementById("detailContent").innerHTML = pages[pageId].content; currentPage = pageId; window.scrollTo(0, 0); } }
/* পেজ রিফ্রেশ হলে আগের পেজে থাকার জন্য */

window.addEventListener("load",function(){

    let savedPage = localStorage.getItem("currentPage");

    if(savedPage && pages[savedPage]){

        openPage(savedPage,false);

    }

});

/* ফোনের Back Button */

window.addEventListener("popstate",function(event){

    if(event.state && event.state.page){

        openPage(event.state.page,false);

    }else{

        showHome(false);

    }

});

    openPage("contact");

    setTimeout(function(){

        let message =
        "🛒 নতুন অর্ডার\n\n" +
        "📌 সার্ভিস: " + service + "\n" +
        "📝 বিস্তারিত: " + details + "\n\n" +

        ).value = message;

        document.getElementById(
            "contactTitle"
        ).innerText = "🛒 অর্ডার সম্পন্ন করুন";

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    },300);

}


/* ================= SEND WHATSAPP ================= */

function sendWhatsAppTo(number){

    let message =
    document.getElementById(
        "orderMessage"
    ).value.trim();

    if(message === ""){

        alert(
            "দয়া করে অর্ডারের বিস্তারিত লিখুন।"
        );

        return;
    }

    let url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);

    window.open(url,"_blank");

}
